services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"   # API REST/gRPC
      - "6334:6334"   # API gRPC interne
    volumes:
      - qdrant_storage:/qdrant/storage   # stockage persistant : survit à un `docker compose down`
    restart: unless-stopped

volumes:
  qdrant_storage:
